name: at_tayyibun
description: "A new Flutter project."
publish_to: 'none'
# First iOS submission. The part after `+` is the build number; iOS rejects an
# upload whose build number is not strictly greater than every previous one for
# the same version string, so bump it on every Transporter upload — including
# re-uploads of a rejected build.
version: 0.1.3+4

environment:
  sdk: ^3.12.2

dependencies:
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  go_router: ^17.4.0
  google_sign_in: ^7.2.0
  path_provider: ^2.1.6
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/hero-couple-sunset.jpg
    - assets/hero-couple-sunset-light.jpg

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/logo.png"
