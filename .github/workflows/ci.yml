# CI: install, lint, typecheck and unit-test the web + api workspaces.
# The Flutter app in apps/mobile is not covered here.
# Needs no secrets or variables.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager": "pnpm@9.15.4" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo lint -> `eslint .` (web) + `eslint` (api), using each app's
      # eslint.config.mjs. Errors fail the job; warnings do not.
      - name: Lint
        run: pnpm lint

      # turbo typecheck -> `tsc --noEmit` in apps/web and apps/api.
      - name: Typecheck
        run: pnpm typecheck

      # turbo test -> the unit tests of apps/api (jest) and apps/web.
      - name: Test
        run: pnpm test
