# Local development only. Never run this on the production VM: the credentials
# are throwaway defaults. Ports bind to loopback so nothing is reachable from
# the LAN (Docker-published ports bypass UFW).
services:
  postgres:
    image: postgres:15-alpine
    container_name: at-tayyibun-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: at_tayyibun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: at-tayyibun-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Adminer for DB management — `docker compose --profile tools up`
  adminer:
    image: adminer:latest
    container_name: at-tayyibun-adminer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
